<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<body>
    <header>
        <h1>About Our Puma Vacation Website</h1>
    </header>
    <section>
        <form method="post" action="https://webdevbasics.net/scripts/demo.php">
            <div>
                <label for="myName">Name:</label>
                <input type="text" id="myName" name="myName">
            </div>
            <div>
                <label for="myEmail">Email:</label>
                <input type="email" id="myEmail" name="myEmail">
            </div>
            Choose the browsers you use<br>
            <div>
                <input type="checkbox" name="go" id="go" value="yes">
                <label for="go">Google Chrome</label>
            </div>
            <div>
                <input type="checkbox" name="firefox" id="firefox" value="yes">
                <label for="firefox">Mobzilla Firefox</label>
            </div>
            <div>
                <input type="checkbox" name="edge" id="edge" value="yes">
                <label for="edge">Microsoft Edge</label>
            </div>
            Would you like to be on our mailing list:<br>
            <div>
                <input type="radio" name="mailingList" id="yes" value="yes">
                <label for="yes">Yes</label>
            </div>
            <div>
                <input type="radio" name="mailingList" id="no" value="no">
                <label for="no">No</label>
            </div>
            <div>
                <span>Please provide any comments:</span><br>
                <textarea name="comments" id="comments" cols="30" rows="10"></textarea>
            </div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </section>
</body>
</html>
